<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="620" fill="#ffffff"/>
  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">orbit-web - Terraform-provisioned AWS architecture (ap-south-1)</text>

  <!-- Internet -->
  <rect x="390" y="52" width="200" height="44" rx="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="490" y="80" text-anchor="middle" font-size="15" fill="#0c4a6e">Internet / users</text>

  <!-- Terraform -->
  <rect x="24" y="52" width="190" height="78" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="119" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">Terraform</text>
  <text x="119" y="98" text-anchor="middle" font-size="12" fill="#4c1d95">providers: aws, random</text>
  <text x="119" y="116" text-anchor="middle" font-size="12" fill="#4c1d95">state: terraform.tfstate</text>
  <path d="M214 92 L300 150" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#purple)"/>
  <text x="232" y="140" font-size="11" fill="#6d28d9">plan / apply / destroy</text>

  <!-- Region / VPC -->
  <rect x="300" y="130" width="656" height="470" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="316" y="154" font-size="15" font-weight="bold" fill="#334155">VPC orbit-web-vpc  10.20.0.0/16</text>

  <!-- IGW -->
  <rect x="430" y="114" width="120" height="34" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="490" y="136" text-anchor="middle" font-size="13" fill="#78350f">Internet Gateway</text>
  <line x1="490" y1="96" x2="490" y2="114" stroke="#0369a1" stroke-width="2"/>

  <!-- Public subnet -->
  <rect x="324" y="176" width="300" height="300" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="340" y="200" font-size="14" font-weight="bold" fill="#065f46">Public subnet 10.20.1.0/24 (AZ a)</text>
  <text x="340" y="218" font-size="11" fill="#065f46">route table: 0.0.0.0/0 -> IGW, 10.20.0.0/16 -> local</text>
  <line x1="490" y1="148" x2="474" y2="262" stroke="#b45309" stroke-width="2" marker-end="url(#amber)"/>

  <!-- SG + EC2 -->
  <rect x="352" y="262" width="244" height="190" rx="8" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="364" y="282" font-size="12" font-weight="bold" fill="#b91c1c">Security group orbit-web-web-sg</text>
  <text x="364" y="298" font-size="11" fill="#b91c1c">in: 80/tcp 0.0.0.0/0, 22/tcp admin IP only</text>
  <text x="364" y="312" font-size="11" fill="#b91c1c">out: all</text>
  <rect x="384" y="326" width="180" height="110" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="474" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">EC2 orbit-web-web-1</text>
  <text x="474" y="370" text-anchor="middle" font-size="12" fill="#9a3412">t3.micro, Ubuntu AMI</text>
  <text x="474" y="388" text-anchor="middle" font-size="12" fill="#9a3412">public IP, nginx (user_data)</text>
  <text x="474" y="406" text-anchor="middle" font-size="12" fill="#9a3412">IMDSv2, encrypted gp3 8 GiB</text>
  <text x="474" y="424" text-anchor="middle" font-size="12" fill="#9a3412">instance profile -> IAM role</text>

  <!-- Private subnet -->
  <rect x="648" y="176" width="284" height="150" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="664" y="200" font-size="14" font-weight="bold" fill="#1e3a8a">Private subnet 10.20.2.0/24 (AZ a)</text>
  <text x="664" y="218" font-size="11" fill="#1e3a8a">route table: 10.20.0.0/16 -> local only</text>
  <text x="664" y="250" font-size="12" fill="#1e3a8a">reserved for a database tier</text>
  <text x="664" y="268" font-size="12" fill="#1e3a8a">(no route to the internet)</text>

  <!-- IAM -->
  <rect x="648" y="350" width="284" height="80" rx="8" fill="#fdf4ff" stroke="#a21caf" stroke-width="2"/>
  <text x="790" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#701a75">IAM role orbit-web-web-role</text>
  <text x="790" y="394" text-anchor="middle" font-size="12" fill="#701a75">trust: ec2.amazonaws.com</text>
  <text x="790" y="412" text-anchor="middle" font-size="12" fill="#701a75">allow s3:GetObject/ListBucket on assets only</text>
  <line x1="564" y1="418" x2="648" y2="392" stroke="#a21caf" stroke-width="2" marker-end="url(#pink)"/>

  <!-- S3 (regional service, outside the VPC) -->
  <rect x="648" y="470" width="284" height="96" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="790" y="494" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">S3 orbit-web-assets-&lt;hex&gt;</text>
  <text x="790" y="514" text-anchor="middle" font-size="12" fill="#14532d">private, SSE-S3 encrypted</text>
  <text x="790" y="532" text-anchor="middle" font-size="12" fill="#14532d">object: site/index.html</text>
  <text x="790" y="552" text-anchor="middle" font-size="11" fill="#14532d">(regional service, reached via the IGW)</text>
  <path d="M520 436 C 560 520, 600 520, 648 516" stroke="#15803d" stroke-width="2" fill="none" marker-end="url(#green)"/>
  <text x="530" y="530" font-size="11" fill="#15803d">boot: aws s3 cp index.html</text>

  <text x="324" y="590" font-size="12" fill="#475569">Dependencies: VPC -> subnets/IGW/SG -> route tables -> EC2 (depends_on public route); S3 bucket -> object, IAM policy -> instance profile -> EC2</text>

  <defs>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="pink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a21caf"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
  </defs>
</svg>
