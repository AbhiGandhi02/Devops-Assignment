apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-vault
  namespace: orbit-vault
  labels:
    app: orbit-vault
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbit-vault
  template:
    metadata:
      labels:
        app: orbit-vault
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orbit-vault
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: VAULT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orbit-vault-token
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
      volumes:
        - name: tmp
          emptyDir: {}
