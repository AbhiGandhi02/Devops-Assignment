# Environment file that Argo CD layers on top of helm/readtrack/values-prod.yaml.
# The CI pipeline rewrites image.tag here after a green build (commit SHA),
# so a merge to main is all it takes to roll out a new version.
image:
  tag: "local"
database:
  existingSecret: readtrack-db
config:
  welcomeMessage: "Production - managed by Argo CD"
