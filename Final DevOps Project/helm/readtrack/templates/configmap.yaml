apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "readtrack.fullname" . }}-config
  labels: {{- include "readtrack.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.global.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  WELCOME_MESSAGE: {{ .Values.config.welcomeMessage | quote }}
  DB_HOST: {{ include "readtrack.fullname" . }}-postgres
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
