{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "readtrack.fullname" . }}
  labels: {{- include "readtrack.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # /api -> FastAPI, everything else -> the static frontend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "readtrack.fullname" . }}-backend
                port: { number: {{ .Values.backend.port }} }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "readtrack.fullname" . }}-frontend
                port: { number: 80 }
{{- end }}
