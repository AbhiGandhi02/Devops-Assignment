{{- if .Values.networkPolicy.enabled }}
# Only the backend pods may open connections to PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "readtrack.fullname" . }}-postgres-allow-backend
  labels: {{- include "readtrack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "readtrack.selector" (dict "component" "postgres" "root" .) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "readtrack.selector" (dict "component" "backend" "root" .) | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
