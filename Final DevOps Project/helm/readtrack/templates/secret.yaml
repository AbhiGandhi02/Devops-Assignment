{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "readtrack.secretName" . }}
  labels: {{- include "readtrack.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKey }}: {{ required "set database.password (--set-string) or database.existingSecret" .Values.database.password | quote }}
{{- end }}
