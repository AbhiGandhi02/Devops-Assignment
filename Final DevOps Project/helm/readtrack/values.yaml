# Default values for readtrack. Environment files (values-dev.yaml, values-prod.yaml,
# ../../gitops/values-gitops.yaml) only override what differs.

global:
  environment: dev

image:
  registry: ghcr.io/abhigandhi02
  # CI tags every image with the Git commit SHA - never "latest"
  tag: "latest"
  pullPolicy: IfNotPresent

config:
  logLevel: INFO
  welcomeMessage: "Track what you read."

# Database credentials. Either the chart creates the Secret (create: true + password)
# or it points at a Secret created outside Git (GitOps) via existingSecret.
database:
  name: readtrack
  user: readtrack
  existingSecret: ""
  secretKey: postgres-password
  password: ""

backend:
  repository: readtrack-backend
  replicas: 2
  port: 8000
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPU: 70

frontend:
  repository: readtrack-frontend
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 96Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPU: 75

postgres:
  image: public.ecr.aws/docker/library/postgres:16-alpine
  storage: 1Gi
  storageClassName: ""   # "" = cluster default (kind: standard / local-path)
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

ingress:
  enabled: true
  className: nginx
  host: readtrack.localhost

podDisruptionBudget:
  enabled: true

networkPolicy:
  enabled: true

monitoring:
  serviceMonitor:
    enabled: false
    interval: 15s
    # must match the kube-prometheus-stack release label so Prometheus selects it
    releaseLabel: monitoring
  prometheusRule:
    enabled: false
