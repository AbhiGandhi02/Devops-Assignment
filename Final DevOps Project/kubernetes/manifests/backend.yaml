# FastAPI backend: initContainer runs the Alembic migration, then 2 replicas serve the API.
# Probes: startup + liveness on /health (process alive), readiness on /ready (DB reachable).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readtrack-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/abhigandhi02/readtrack-backend:latest
          command: ["sh", "-c", "for i in $(seq 1 30); do alembic upgrade head && exit 0; echo 'db not ready, retrying'; sleep 3; done; exit 1"]
          envFrom:
            - configMapRef: { name: readtrack-config }
          env: &dbenv
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: readtrack-db, key: postgres-password }
            - name: DATABASE_URL
              value: postgresql+psycopg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)
          securityContext: &containersec
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: &backendres
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
      containers:
        - name: backend
          image: ghcr.io/abhigandhi02/readtrack-backend:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: readtrack-config }
          env: *dbenv
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          resources: *backendres
          securityContext: *containersec
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: readtrack-backend
  labels:
    app.kubernetes.io/name: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
