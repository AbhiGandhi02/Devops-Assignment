# Scale the backend on CPU (needs metrics-server and CPU requests on the pods).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: readtrack-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: readtrack-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
