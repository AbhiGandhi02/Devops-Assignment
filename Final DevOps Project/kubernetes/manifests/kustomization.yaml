# Plain Kubernetes manifests for ReadTrack (the Helm chart in ../../helm is the templated version).
# Deploy:  kubectl apply -k kubernetes/          (adds the namespace + image tags)
# The database Secret is NOT in Git - create it first:
#   kubectl -n readtrack create secret generic readtrack-db --from-literal=postgres-password="$(openssl rand -hex 16)"
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: readtrack
    includeSelectors: false
resources:
  - configmap.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - hpa.yaml
