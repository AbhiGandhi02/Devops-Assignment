# kube-prometheus-stack, trimmed for a 2-node kind cluster.
# helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml
fullnameOverride: monitoring

# kind does not expose these control-plane components on reachable addresses
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }

prometheus:
  prometheusSpec:
    retention: 2d
    scrapeInterval: 15s
    evaluationInterval: 15s
    # pick up ServiceMonitors / PrometheusRules from every namespace that carry release=monitoring
    serviceMonitorSelector:
      matchLabels: { release: monitoring }
    ruleSelector:
      matchLabels: { release: monitoring }
    serviceMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: { storage: 2Gi }

grafana:
  adminUser: admin
  # the admin password is NOT in Git: it is read from a Secret created by monitoring/install.sh
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: browser
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard   # every ConfigMap with this label is loaded as a dashboard
      searchNamespace: ALL
  resources:
    requests: { cpu: 50m, memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 24Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
