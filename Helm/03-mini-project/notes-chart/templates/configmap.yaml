apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "notes.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.app.name | quote }}
  ENVIRONMENT: {{ .Values.app.environment | quote }}
  index.html: |
    <h1>{{ .Values.app.message }}</h1>
    <p>app={{ .Values.app.name }} env={{ .Values.app.environment }} release={{ .Release.Name }} revision={{ .Release.Revision }} image={{ .Values.image.repository }}:{{ .Values.image.tag }}</p>
