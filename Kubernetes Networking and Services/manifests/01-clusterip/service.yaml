# ClusterIP: stable virtual IP + DNS name, reachable only from inside the cluster.
# Service port 9090 is deliberately different from the container port 80.
apiVersion: v1
kind: Service
metadata:
  name: site-internal-svc
  labels:
    app: site-internal
spec:
  type: ClusterIP
  selector:
    app: site-internal
  ports:
    - name: http
      port: 9090
      targetPort: 80
      protocol: TCP
