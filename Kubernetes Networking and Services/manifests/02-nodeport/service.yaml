# NodePort: opens port 30090 on EVERY node, on top of a normal ClusterIP.
apiVersion: v1
kind: Service
metadata:
  name: site-nodeport-svc
  labels:
    app: site-nodeport
spec:
  type: NodePort
  selector:
    app: site-nodeport
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30090
      protocol: TCP
