# emptyDir: scratch space shared by the containers of ONE Pod.
# Created empty when the Pod starts, deleted forever when the Pod is removed.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: storage-lab
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date '+%T written by writer' >> /cache/log.txt; sleep 2; done"]
      volumeMounts:
        - name: cache
          mountPath: /cache
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: cache
          mountPath: /shared        # same volume, different path
  volumes:
    - name: cache
      emptyDir:
        sizeLimit: 50Mi
