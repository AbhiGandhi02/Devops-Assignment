# In-cluster load generator: 3 Pods, each hammering the Service in a tight loop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: hpa-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: hammer
          image: busybox:1.36
          command: ["sh", "-c", "echo 'sending load to orbit-web'; while true; do wget -q -O /dev/null http://orbit-web; done"]
