# Healthy backend: http-echo listening on 5678.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: troubleshoot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          args: ["-text=orders-api ok", "-listen=:5678"]
          ports:
            - containerPort: 5678
