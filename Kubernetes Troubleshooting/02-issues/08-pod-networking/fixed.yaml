# FIX: bind to 0.0.0.0 so the server listens on the Pod network interface too
apiVersion: v1
kind: Pod
metadata:
  name: ledger-api
  namespace: troubleshoot
  labels:
    app: ledger-api
spec:
  containers:
    - name: api
      image: python:3.12-alpine
      command: ["python3", "-m", "http.server", "8000", "--bind", "0.0.0.0"]
      ports:
        - containerPort: 8000
