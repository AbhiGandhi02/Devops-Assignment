# FIX: give the container a memory limit that fits its real working set
apiVersion: v1
kind: Pod
metadata:
  name: image-resizer
  namespace: troubleshoot
spec:
  restartPolicy: Never
  containers:
    - name: resizer
      image: python:3.12-alpine
      command: ["python3", "-c", "data = bytearray(150 * 1024 * 1024); print('resized batch using', len(data) // 1048576, 'MiB')"]
      resources:
        limits:
          memory: 256Mi
