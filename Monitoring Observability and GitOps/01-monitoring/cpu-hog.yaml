# A deliberately badly-behaved Pod: an endless busy loop capped at 200m CPU.
# It sits at ~100% of its CPU limit, which makes the ContainerHighCPU alert fire.
apiVersion: v1
kind: Pod
metadata:
  name: cpu-hog
  namespace: observability
  labels: {app: cpu-hog}
spec:
  containers:
    - name: burn
      image: busybox:1.36
      command: ["sh", "-c", "while true; do :; done"]
      resources:
        requests: {cpu: 50m, memory: 8Mi}
        limits: {cpu: 200m, memory: 16Mi}
