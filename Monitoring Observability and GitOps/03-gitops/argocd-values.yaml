# Lightweight Argo CD for a local kind cluster.
# Chart: argo/argo-cd 10.10.0 (Argo CD v3.5.4)
dex:
  enabled: false          # no SSO needed, I log in as the local admin user
notifications:
  enabled: false
applicationSet:
  replicas: 1
configs:
  params:
    server.insecure: true # TLS terminated by kubectl port-forward on my laptop only
  cm:
    timeout.reconciliation: 60s   # poll Git every 60s instead of the default 120s
